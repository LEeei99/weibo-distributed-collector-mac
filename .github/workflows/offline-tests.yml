name: Offline compatibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record runner platform
        run: python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Install pinned Python dependency
        run: python -m pip install -r requirements.txt
      - name: Test distribution, locks, checkpoints and returns
        run: python -B -m unittest discover -s tests -v
      - name: Test browser classification and process supervision
        run: python -B -m unittest discover -s code/tests -v
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: |
          for script in Setup-Mac.sh Run-Worker.sh Monitor-Worker.sh Pack-Return.sh; do
            bash -n "$script"
          done
      - name: Install Chromium for local HTML smoke test
        if: runner.os == 'macOS'
        run: python -m playwright install chromium
      - name: Exercise real browser timeout without website requests
        if: runner.os == 'macOS'
        env:
          WEIBO_BROWSER_SMOKE: "1"
        run: python -B -m unittest discover -s tests -p test_browser_smoke.py -v
